<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Qhawaq Ticket Watcher banner">
  <defs>
    <clipPath id="round"><rect x="0" y="0" width="1200" height="300" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="#10343b"/>
    <rect width="1200" height="300" fill="#13424a" opacity="0.5"/>
    <!-- faint Andean step pattern, bottom -->
    <g opacity="0.12" fill="none" stroke="#2fb4c4" stroke-width="6" stroke-linejoin="round">
      <path d="M0 276 l26 -26 l26 26 l26 -26 l26 26 l26 -26 l26 26 l26 -26 l26 26 l26 -26 l26 26 l26 -26 l26 26 l26 -26 l26 26 l26 -26 l26 26 l26 -26 l26 26 l26 -26 l26 26 l26 -26 l26 26 l26 -26 l26 26 l26 -26 l26 26 l26 -26 l26 26 l26 -26 l26 26 l26 -26 l26 26 l26 -26 l26 26 l26 -26 l26 26 l26 -26 l26 26 l26 -26 l26 26 l26 -26 l26 26 l26 -26 l26 26 l26 -26 l26 26"/>
    </g>

    <!-- ===== Text block ===== -->
    <text x="64" y="118" font-family="Segoe UI, Arial, sans-serif" font-size="74" font-weight="800" fill="#f6ecd9" letter-spacing="1">QHAWAQ</text>
    <text x="68" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#37c3d1" letter-spacing="2">TICKET WATCHER</text>
    <!-- Andean accent line -->
    <g stroke="#e8a13c" stroke-width="4" fill="none">
      <path d="M70 182 l14 -14 l14 14 l14 -14 l14 14 l14 -14 l14 14"/>
    </g>
    <text x="70" y="214" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#a9ccd1">Event ticket availability monitor · instant Telegram alerts</text>
    <text x="70" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#6f9aa0">Python · Playwright · Telegram Bot API · Docker</text>

    <!-- ===== Mascot badge (right) ===== -->
    <circle cx="1020" cy="150" r="128" fill="#0c2a30"/>
    <circle cx="1020" cy="150" r="128" fill="none" stroke="#2fb4c4" stroke-width="6"/>
    <g transform="translate(1020,150) scale(0.92)">
      <!-- ears -->
      <path d="M-70 -56 Q-82 -120 -40 -110 Q-20 -96 -24 -50 Z" fill="#f08a33"/>
      <path d="M70 -56 Q82 -120 40 -110 Q20 -96 24 -50 Z" fill="#f08a33"/>
      <path d="M-58 -62 Q-66 -102 -40 -96 Q-28 -88 -30 -58 Z" fill="#f3b0a8"/>
      <path d="M58 -62 Q66 -102 40 -96 Q28 -88 30 -58 Z" fill="#f3b0a8"/>
      <!-- head -->
      <ellipse cx="0" cy="0" rx="92" ry="86" fill="#f08a33"/>
      <!-- forehead M -->
      <g fill="none" stroke="#c75f1a" stroke-width="6" stroke-linecap="round" opacity="0.8">
        <path d="M-20 -44 Q-16 -70 -6 -78"/>
        <path d="M0 -46 L0 -80"/>
        <path d="M20 -44 Q16 -70 6 -78"/>
      </g>
      <!-- lower face + muzzle -->
      <path d="M-86 6 Q-82 64 0 70 Q82 64 86 6 Q62 44 0 44 Q-62 44 -86 6 Z" fill="#fbe9c8"/>
      <ellipse cx="0" cy="30" rx="48" ry="30" fill="#fbe9c8"/>
      <!-- eyes -->
      <g>
        <ellipse cx="-34" cy="-2" rx="20" ry="24" fill="#2d4433"/>
        <ellipse cx="-34" cy="-2" rx="16" ry="20" fill="#5fb673"/>
        <ellipse cx="-34" cy="4" rx="16" ry="13" fill="#3f9457"/>
        <ellipse cx="-34" cy="1" rx="8" ry="13" fill="#1d1b17"/>
        <circle cx="-39" cy="-8" r="5" fill="#ffffff"/>
      </g>
      <g>
        <ellipse cx="34" cy="-2" rx="20" ry="24" fill="#2d4433"/>
        <ellipse cx="34" cy="-2" rx="16" ry="20" fill="#5fb673"/>
        <ellipse cx="34" cy="4" rx="16" ry="13" fill="#3f9457"/>
        <ellipse cx="34" cy="1" rx="8" ry="13" fill="#1d1b17"/>
        <circle cx="29" cy="-8" r="5" fill="#ffffff"/>
      </g>
      <!-- nose + mouth -->
      <path d="M-10 26 Q0 38 10 26 Q4 46 0 46 Q-4 46 -10 26 Z" fill="#ef7fa0"/>
      <path d="M0 46 Q0 60 -12 64 M0 46 Q0 60 12 64" fill="none" stroke="#9c5a3f" stroke-width="4" stroke-linecap="round"/>
      <!-- whiskers -->
      <g stroke="#f6e6c8" stroke-width="3" stroke-linecap="round" opacity="0.9">
        <path d="M-36 30 Q-72 24 -98 32"/>
        <path d="M-36 40 Q-70 42 -94 54"/>
        <path d="M36 30 Q72 24 98 32"/>
        <path d="M36 40 Q70 42 94 54"/>
      </g>
      <!-- headphones -->
      <path d="M-82 -36 Q0 -126 82 -36" fill="none" stroke="#0d2a30" stroke-width="15" stroke-linecap="round"/>
      <ellipse cx="-90" cy="-6" rx="20" ry="30" fill="#0d2a30"/>
      <ellipse cx="90" cy="-6" rx="20" ry="30" fill="#0d2a30"/>
      <ellipse cx="-88" cy="-6" rx="9" ry="16" fill="#2fb4c4"/>
      <ellipse cx="88" cy="-6" rx="9" ry="16" fill="#2fb4c4"/>
    </g>
    <!-- alert dot -->
    <circle cx="1104" cy="64" r="20" fill="#ff5a4d"/>
    <circle cx="1104" cy="64" r="20" fill="none" stroke="#0c2a30" stroke-width="4"/>
    <text x="1104" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">!</text>
  </g>
</svg>
